html{overflow-x:hidden}body{overflow-x:hidden}main{max-width:620px;padding:12px 12px 20px}header{padding:calc(10px + env(safe-area-inset-top)) 16px 10px}header strong{font-size:21px}.card{padding:13px;margin-bottom:11px;border-radius:14px}.panel{margin:8px 0;padding:10px}.btn{min-height:44px;touch-action:manipulation}#today>.card>.row{align-items:flex-end}#today>.card>.row>div:last-child{min-width:0!important;max-width:none!important;flex:1}#workdate{width:100%;max-width:100%}.template-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.template-options .btn{width:100%;min-width:0;padding:9px 4px;font-size:14px}.exercise .row,.card>.row{min-width:0}.sets{grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 33px;gap:5px}.setdel{width:33px}.sets input{padding:8px 5px;text-align:center}.tabs{gap:2px;padding-left:5px;padding-right:5px}.tab{font-size:12px}.weight-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.weight-row>div:nth-child(3),.weight-row>button{grid-column:1/-1}#finishPanel{padding:10px}@media(max-width:370px){main{padding:9px 8px}.card{padding:10px}.btn{padding:8px 9px}.sets{grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 29px;gap:4px}.setdel{width:29px}}</style></head><body><header><strong>练力</strong></header><main><section id="today"><div class="card"><div class="row wrap"><div><h2 style="margin-bottom:6px">训练记录</h2><div class="muted" id="dateSubtitle">训练日期</div></div><div style="min-width:150px;max-width:190px;flex:1"><label for="workdate">日期</label><input type="date" id="workdate"></div></div><p class="summary muted" id="dailySummary" style="margin-top:13px"></p><div class="panel" id="templatePanel"><div style="font-weight:700;margin-bottom:7px">训练类型</div><div class="template-options"><button class="btn soft" data-template="push">Day 1 · 推</button><button class="btn soft" data-template="pull">Day 2 · 拉</button><button class="btn soft" data-template="legs">Day 3 · 腿</button><button class="btn soft" data-template="other">其他</button></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="addExercise">＋ 添加动作</button></div></div><div id="exerciseList"></div><div id="finishPanel" class="card hidden"><button class="btn primary" id="confirmDay" style="width:100%">保存这一天</button></div></section><section id="history" class="hidden"><div class="card"><h2>历史记录</h2><div id="historyList"></div></div><div class="card"><h2>动作重量趋势</h2><p class="muted">选择动作，按训练日期查看该动作每次训练的最大单组重量。仅统计已填写次数的组。</p><label for="progressExercise">选择动作</label><select id="progressExercise"></select><div id="progressChart" class="line-chart"></div></div><div class="card"><h2>历史数据恢复</h2><p class="muted">如果训练日意外消失，可检查最近的本地自动快照。恢复会覆盖当前记录，请先导出备份。</p><div id="recoveryList"></div></div></section><section id="bodyweight" class="hidden"><div class="card"><h2>体重记录</h2><p class="muted">选择日期与测量时段，记录每次体重；不需要填写具体时刻。</p><div class="weight-row"><div><label for="weightDate">测量日期</label><input type="date" id="weightDate"></div><div><label for="weightPeriod">测量时段</label><select id="weightPeriod"><option value="wake">起床后</option><option value="toilet">如厕后</option><option value="bed">睡前</option></select></div><div><label for="weightValue">体重（斤）</label><input type="number" id="weightValue" inputmode="decimal" step="0.1" min="2" max="1000" placeholder="如 138"></div><button class="btn primary" id="saveWeight">记录体重</button></div><p class="message" id="weightError"></p></div><div class="card"><h2>体重趋势</h2><div id="weightSummary" class="muted">暂无记录</div><div id="weightChart"></div></div><div class="card"><div class="row wrap"><h2 style="margin:0">历史体重</h2></div><div id="weightList"></div></div></section><section id="manage" class="hidden"><div class="card"><h2>动作管理</h2><div class="row wrap"><input id="newActionName" maxlength="35" placeholder="新增动作名称，例如：史密斯卧推" style="flex:1;min-width:160px"><button class="btn primary" id="addAction">添加</button></div><div class="message" id="actionError"></div><div id="actionList"></div></div><div class="card"><h2>备份与恢复</h2><p class="muted">导出 JSON 文件保存所有训练数据。更换手机或清除浏览器数据后，可导入备份恢复。</p><div class="actions"><button class="btn soft" id="exportData">导出备份</button><button class="btn" id="importBtn">导入备份</button><input type="file" id="importFile" accept=".json,application/json" class="hidden"></div><div class="message" id="importError"></div></div></section></main><nav class="tabs" aria-label="底部导航"><button class="tab active" data-tab="today">今日训练</button><button class="tab" data-tab="history">历史记录</button><button class="tab" data-tab="bodyweight">体重</button><button class="tab" data-tab="manage">动作管理</button></nav><div id="toast" role="status" aria-live="polite"></div><script>
(function(){'use strict';
const KEY='lianli_v2';const toJin=v=>Math.round(Number(v||0)*200)/100;const fromJin=v=>Math.round(Number(v||0)*50)/100;const jinText=v=>toJin(v).toString();const builtin=['高位下拉','坐姿划船','反向飞鸟','哑铃弯举','史密斯卧推','杠铃卧推','上斜卧推','蝴蝶机夹胸','坐姿推胸','哑铃肩推','侧平举','深蹲','腿举','腿屈伸','腿弯举','硬拉','引体向上','绳索下压','卷腹','平板支撑'];
const $=id=>document.getElementById(id);const localDate=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};let date=localDate();let state={actions:builtin.slice(),days:{},weights:[],dayTemplates:{}};let saveOK=true;let draft=null;let draftDate=null;let actionDrafts={};let completedScreen=false;
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',2200)};
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function id(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function validDate(v){return /^\d{4}-\d{2}-\d{2}$/.test(v)&&!Number.isNaN(new Date(v+'T12:00:00').getTime())}
function init(){try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(d&&Array.isArray(d.actions)&&d.days&&typeof d.days==='object'){state=d;if(!Array.isArray(state.weights))state.weights=[];if(!state.dayTemplates||typeof state.dayTemplates!=='object'||Array.isArray(state.dayTemplates))state.dayTemplates={}}}}catch(e){toast('读取历史数据失败，请检查浏览器存储')};try{const saved=JSON.parse(localStorage.getItem('lianli_v7_draft')||'null');if(saved&&saved.date&&saved.draft&&!state.days[saved.date]){date=saved.date;draftDate=date;draft=saved.draft;actionDrafts=saved.changes||{}}}catch(e){}if(localStorage.getItem('lianli_v7_finished')===date&&state.days[date]&&!draft){completedScreen=true;$('workdate').value=''}else $('workdate').value=date;render()}
function save(){try{
 const next=JSON.stringify(state),old=localStorage.getItem(KEY);
 if(old&&old!==next){try{const snapshots=JSON.parse(localStorage.getItem('lianli_snapshots_v6')||'[]');if(!snapshots.length||snapshots[0].data!==old){snapshots.unshift({at:new Date().toISOString(),data:old});localStorage.setItem('lianli_snapshots_v6',JSON.stringify(snapshots.slice(0,6)))}}catch(snapshotError){/* Backup quota must not block saving the primary record. */}}
 localStorage.setItem(KEY,next);if(localStorage.getItem(KEY)!==next)throw Error('写入校验失败');saveOK=true;return true;
 }catch(e){saveOK=false;toast('保存失败，请立即导出备份');return false}}
function rememberDraft(){try{if(isDraft())localStorage.setItem('lianli_v7_draft',JSON.stringify({date,draft,changes:actionDrafts}));else localStorage.removeItem('lianli_v7_draft')}catch(e){toast('草稿缓存失败，请及时保存动作')}}
function commitDraft(){if(!isDraft())return true;if(state.days[date]?.length)return false;state.days[date]=draft.items.map(x=>({id:x.id,name:x.name,sets:x.sets.map(y=>({...y}))}));state.dayTemplates[date]=draft.which;for(const item of draft.items)if(!state.actions.includes(item.name))state.actions.push(item.name);draft=null;draftDate=null;rememberDraft();return save()}
function day(){return draftDate===date&&draft?draft.items:(state.days[date]||[])}
function isDraft(){return draftDate===date&&!!draft}
function writeDay(){if(isDraft())return;save()}
function openDraft(which){completedScreen=false;const preset=presets[which]||[];draftDate=date;draft={which,items:preset.map(([name,count])=>({id:id(),name,sets:Array.from({length:count},()=>({id:id(),weight:0,reps:0}))}))};actionDrafts={};rememberDraft();renderToday()}
function discardDraft(){draft=null;draftDate=null;actionDrafts={};rememberDraft()}function ensure(){if(!state.days[date])state.days[date]=[];return state.days[date]}
function section(tab){['today','history','bodyweight','manage'].forEach(x=>$(x).classList.toggle('hidden',x!==tab));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='history'){renderHistory();renderProgress();renderRecovery()};if(tab==='bodyweight')renderWeights();if(tab==='manage')renderActions()}
function render(){renderToday();renderHistory();renderActions();renderWeights()}
function renderToday(){const arr=completedScreen?[]:day();const pending=isDraft();$('finishPanel').classList.toggle('hidden',completedScreen||(!pending&&!state.days[date]));$('templatePanel').classList.toggle('hidden',completedScreen);$('addExercise').classList.toggle('hidden',completedScreen);$('dailySummary').classList.toggle('hidden',completedScreen||!arr.length);$('dateSubtitle').textContent=completedScreen?'':date===localDate()?'今天':date;$('dailySummary').textContent=arr.length+' 个动作 · '+arr.reduce((n,e)=>n+e.sets.length,0)+' 组';document.querySelectorAll('[data-template]').forEach(b=>{const selected=(pending?draft.which:state.dayTemplates?.[date])===b.dataset.template;b.classList.toggle('primary',selected);b.classList.toggle('soft',!selected);b.setAttribute('aria-pressed',String(selected))});const target=$('exerciseList');target.innerHTML=arr.length?'':'';arr.forEach((e,i)=>{const box=document.createElement('div');box.className='card';box.dataset.ex=e.id;const prev=lastSession(e.name,date);box.innerHTML='<div class="row wrap"><div style="flex:1;min-width:145px"><h3>'+esc(e.name)+'</h3><div class="muted sm">动作 '+(i+1)+'</div></div><button class="btn danger" data-action="deleteExercise">删除动作</button></div>'+(prev?'<div class="panel muted">上次（'+esc(prev.date)+'）：'+prev.sets.map(s=>jinText(s.weight)+'斤 × '+esc(s.reps)+'次').join(' / ')+'</div>':'')+'<div class="sets"><div></div><label>重量（斤）</label><label>次数</label><div></div></div><div class="setRows"></div><div class="row wrap" style="margin-top:13px"><button class="btn soft" data-action="addSet">＋ 添加一组</button><button class="btn primary" data-action="saveExercise">保存此动作</button><span class="muted sm" data-save-indicator>未完成</span></div>';target.appendChild(box);const list=box.querySelector('.setRows');const editing=actionDrafts[e.id]||e;box.querySelector('[data-save-indicator]').textContent=actionDrafts[e.id]?'待保存':(e.sets.some(x=>x.reps>0)?'已保存':'未完成');editing.sets.forEach((s,j)=>{const line=document.createElement('div');line.className='sets';line.dataset.set=s.id;line.innerHTML='<span class="setindex">'+(j+1)+'</span><input type="number" inputmode="decimal" min="0" max="4000" step="1" aria-label="第'+(j+1)+'组重量" data-field="weight" value="'+esc(s.weight)+'"><input type="number" inputmode="numeric" min="0" max="1000" step="1" aria-label="第'+(j+1)+'组次数" data-field="reps" value="'+esc(s.reps)+'"><button class="setdel" data-action="deleteSet" aria-label="删除第'+(j+1)+'组">×</button>';list.appendChild(line)})})}
function lastSession(name,before){return Object.keys(state.days).filter(d=>d<before).sort().reverse().map(d=>({date:d,sets:(state.days[d]||[]).filter(e=>e.name===name).flatMap(e=>e.sets)})).find(x=>x.sets.length)||null}
function addExercise(){
 if(!isDraft()&&!state.days[date]?.length){toast('请先选择 Day 1、Day 2、Day 3 或其他');return}
 const choices=Array.from(new Set([...state.actions,...Object.values(state.days).flat().map(e=>e.name)])).sort((a,b)=>a.localeCompare(b,'zh'));
 const old=$('actionPicker');if(old){old.remove();return}
 const el=document.createElement('div');el.id='actionPicker';el.className='panel';
 el.innerHTML='<label for="partFilter">按部位筛选</label><select id="partFilter"><option value="all">全部部位</option><option value="胸">胸</option><option value="背">背</option><option value="肩">肩</option><option value="手臂">手臂</option><option value="腿">腿</option><option value="腹">腹 / 核心</option><option value="其他">其他</option></select><label for="exercisePick" style="margin-top:8px">选择动作</label><select id="exercisePick"></select><div class="actions" style="margin-top:9px"><button type="button" class="btn primary" id="confirmAdd">添加动作</button><button type="button" class="btn" id="cancelAdd">取消</button></div><div style="margin-top:12px"><label for="customDailyAction">找不到动作？直接输入名称</label><div class="row"><input id="customDailyAction" maxlength="35" placeholder="如：仰卧卷腹"><button type="button" class="btn soft" id="createDailyAction">新增</button></div></div>';
 $('addExercise').parentElement.after(el);
 function group(n){if(/卷腹|平板支撑|腹|核心/.test(n))return '腹';if(/胸|卧推|夹胸|俯卧撑/.test(n))return '胸';if(/划船|下拉|引体|背|硬拉/.test(n))return '背';if(/侧平举|肩推|飞鸟/.test(n))return '肩';if(/弯举|屈伸|下压|二头|三头/.test(n))return '手臂';if(/深蹲|腿|箭步|提踵/.test(n))return '腿';return '其他'}
 function updateChoices(){const part=$('partFilter').value;const opts=choices.filter(n=>part==='all'||group(n)===part);$('exercisePick').innerHTML='<option value="">请选择动作</option>'+opts.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('')}
 function insert(n){if(!n){toast('请选择或输入动作名称');return}if(!state.actions.includes(n)){state.actions.push(n);save()}const item={id:id(),name:n,sets:[{id:id(),weight:0,reps:0}]};if(isDraft())draft.items.push(item);else{ensure().push(item);save()}rememberDraft();el.remove();renderToday()}
 $('partFilter').addEventListener('change',updateChoices);updateChoices();
 $('confirmAdd').addEventListener('click',()=>insert($('exercisePick').value));
 $('createDailyAction').addEventListener('click',()=>{const name=$('customDailyAction').value.trim();if(!name||name.length>35){toast('请输入1至35字的动作名');return}insert(name)});
 $('cancelAdd').addEventListener('click',()=>el.remove());
}
$('addExercise').addEventListener('click',addExercise);
$('confirmDay').addEventListener('click',()=>{
 const dirty=Object.keys(actionDrafts).filter(k=>day().some(a=>a.id===k));
 if(dirty.length&&!confirm('还有 '+dirty.length+' 个动作尚未保存。点击「确定」一键保存并完成，点击「取消」返回编辑。'))return;
 if(!isDraft()&&!state.days[date])return;
 if(!commitDraft()){toast('创建训练日失败，请重试');return}
 for(const a of day()){if(actionDrafts[a.id])a.sets=actionDrafts[a.id].sets.map(x=>({...x}))}
 if(!save()){toast('未能保存，请检查存储');return}
 actionDrafts={};discardDraft();completedScreen=true;try{localStorage.setItem('lianli_v7_finished',date)}catch(e){}$('workdate').value='';renderToday();renderHistory();toast('已完成这一天');
});
$('workdate').addEventListener('change',e=>{if(!validDate(e.target.value)){e.target.value=date;toast('日期无效');return}date=e.target.value;completedScreen=false;discardDraft();$('actionPicker')?.remove();renderToday()});
$('exerciseList').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const ex=b.closest('[data-ex]');const a=day().find(x=>x.id===ex?.dataset.ex);if(!a)return;const action=b.dataset.action;
 if(action==='deleteExercise'){if(!confirm('删除“'+a.name+'”及所有组数？'))return;if(isDraft())draft.items=draft.items.filter(x=>x.id!==a.id);else state.days[date]=day().filter(x=>x.id!==a.id);delete actionDrafts[a.id];writeDay();rememberDraft();renderToday();return}
 if(action==='saveExercise'){
  if(!commitDraft()){toast('无法创建训练日，请重试');return}
  const saved=state.days[date].find(x=>x.id===a.id);
  const changed=actionDrafts[a.id];if(changed&&saved)saved.sets=changed.sets.map(x=>({...x}));
  if(save()){delete actionDrafts[a.id];rememberDraft();renderToday();renderHistory();toast('「'+a.name+'」已保存')}else toast('保存失败');return}
 const tmp=actionDrafts[a.id]||{...a,sets:a.sets.map(s=>({...s}))};actionDrafts[a.id]=tmp;
 if(action==='addSet'){const last=tmp.sets.at(-1);tmp.sets.push({id:id(),weight:last?.weight||0,reps:0})}

get.value=''}});
// Template choices populate an uncommitted draft; only confirmation creates a day.

 push:[['坐姿推胸',3],['上斜推胸',2],['哑铃侧平举',3],['蝴蝶机夹胸',2],['哑铃颈后臂屈伸',2],['卷腹',2]],

document.querySelectorAll('[data-template]').forEach(b=>b.addEventListener('click',()=>{

const periodNames={wake:'起床后',toilet:'如厕后',bed:'睡前'};
const periodSort={wake:0,toilet:1,bed:2};
function weightDate(w){return w.date||String(w.time||'').slice(0,10)}
function weightTitle(w){return weightDate(w)+' · '+(periodNames[w.period]|| (w.time&&w.time.includes('T')?w.time.slice(11):'历史记录'))}
function weightOrder(w){const date=weightDate(w);return date+'-'+(w.period in periodSort?String(periodSort[w.period]):'0')+'-'+String(w.time||'')}
$('weightDate').value=localDate();
function renderWeights(){
 const arr=Array.isArray(state.weights)?state.weights:[];

 $('weightSummary').textContent=ordered.length?'共 '+ordered.length+' 条记录 · 最近 '+jinText(ordered[0].value)+' 斤':'暂无体重记录';

  });
  const del=document.createElement('button');del.type='button';del.className='btn danger';del.textContent='删除';
  del.addEventListener('click',()=>{if(!confirm('删除这条体重记录？'))return;state.weights=state.weights.filter(x=>x.id!==w.id);if(editingWeightId===w.id)resetWeightForm();save();renderWeights()});
  actions.append(edit,del);line.append(info,actions);list.appendChild(line);
 });
 const chronological=[...arr].filter(w=>Number.isFinite(+w.value)&&weightDate(w)).sort((a,b)=>weightOrder(a).localeCompare(weightOrder(b))).slice(-40);
 renderLineChart($('weightChart'),chronological.map(w=>({x:weightTitle(w),date:weightDate(w),value:toJin(w.value)})), '斤');

}
function renderLineChart(node,data,unit){
 node.replaceChildren();
 if(!data.length){node.innerHTML='<p class="muted">暂无有效数据</p>';return}
 const W=620,H=250,L=51,R=15,T=21,B=44,vals=data.map(p=>p.value),lo=Math.min(...vals),hi=Math.max(...vals),range=Math.max(hi-lo,unit==='kg'?1:1),low=Math.max(0,lo-range*.17),high=hi+range*.17;
 const X=i=>L+(W-L-R)*(data.length===1?.5:i/(data.length-1)),Y=v=>T+(H-T-B)*(high-v)/(high-low);
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.setAttribute('role','img');svg.setAttribute('aria-label',`折线图：${data.map(p=>p.x+' '+p.value+unit).join('，')}`);
 const add=(tag,attrs,txt)=>{let e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(txt!=null)e.textContent=txt;svg.appendChild(e);return e};
 for(let i=0;i<4;i++){let v=low+(high-low)*i/3,y=Y(v);add('line',{x1:L,x2:W-R,y1:y,y2:y,stroke:'#e5e9f0','stroke-width':1});add('text',{x:L-8,y:y+4,'font-size':11,'text-anchor':'end',fill:'#64748b'},v.toFixed(1))}
 const points=data.map((p,i)=>`${X(i)},${Y(p.value)}`).join(' ');if(data.length>1)add('polyline',{points,fill:'none',stroke:'#2462db','stroke-width':3,'stroke-linejoin':'round','stroke-linecap':'round'});
 data.forEach((p,i)=>{let circle=add('circle',{cx:X(i),cy:Y(p.value),r:4.5,fill:'#2462db',stroke:'#fff','stroke-width':2});let title=document.createElementNS('http://www.w3.org/2000/svg','title');title.textContent=p.x+'：'+p.value+unit;circle.append(title)});
 const step=Math.max(1,Math.ceil(data.length/5));data.forEach((p,i)=>{if(i%step&&i!==data.length-1)return;add('text',{x:X(i),y:H-17,'font-size':11,'text-anchor':'middle',fill:'#64748b'},p.date.slice(5))});
 node.appendChild(svg);const note=document.createElement('div');note.className='muted sm';note.textContent=`${data.length} 次记录 · ${lo.toFixed(1)}–${hi.toFixed(1)} ${unit}`;node.appendChild(note)
}
function renderProgress(){const names=[...new Set(Object.values(state.days).flatMap(items=>Array.isArray(items)?items.map(e=>e.name):[]))].sort((a,b)=>a.localeCompare(b,'zh'));const select=$('progressExercise'),prior=select.value;select.replaceChildren();names.forEach(name=>{let o=document.createElement('option');o.value=name;o.textContent=name;select.append(o)});if(names.includes(prior))select.value=prior;drawProgress()}
function drawProgress(){const name=$('progressExercise').value;if(!name){$('progressChart').innerHTML='<p class="muted">暂无训练记录</p>';return}const data=Object.keys(state.days).sort().flatMap(d=>{const exercises=state.days[d]||[];const sets=exercises.filter(e=>e.name===name).flatMap(e=>e.sets||[]).filter(t=>Number(t.reps)>0&&Number.isFinite(+t.weight));return sets.length?[{date:d,x:d,value:toJin(Math.max(...sets.map(t=>+t.weight)))}]:[]});renderLineChart($('progressChart'),data.slice(-40),'斤')}

function renderRecovery(){const el=$('recoveryList');el.replaceChildren();let arr=[];try{arr=JSON.parse(localStorage.getItem('lianli_snapshots_v6')||'[]')}catch(e){}if(!arr.length){el.innerHTML='<p class="muted">目前尚无自动快照；可以检查之前导出的 JSON 备份。</p>';return}arr.forEach((snap,i)=>{let count=0;try{count=Object.keys(JSON.parse(snap.data).days||{}).length}catch(e){}const row=document.createElement('div');row.className='listline row wrap';const span=document.createElement('span');span.className='sm';span.textContent=new Date(snap.at).toLocaleString('zh-CN')+' · '+count+' 个训练日';const b=document.createElement('button');b.className='btn';b.textContent='恢复';b.addEventListener('click',()=>{if(!confirm('恢复这份快照将覆盖当前全部记录。请先导出当前数据，确认继续？'))return;try{const parsed=JSON.parse(snap.data);if(!parsed.days||!Array.isArray(parsed.actions))throw Error('格式不正确');state=parsed;save();date=localDate();$('workdate').value=date;discardDraft();render();renderRecovery();toast('快照恢复完成')}catch(e){toast('恢复失败：'+e.message)}});row.append(span,b);el.append(row)})}
