<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="练力"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.webmanifest">
<title>练力 · 健身记录</title>
<style>
:root{color-scheme:light;--bg:#f4f6fa;--card:#fff;--text:#192331;--muted:#738091;--line:#e9edf2;--accent:#2563eb;--sub:#eaf1ff;--danger:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;padding-bottom:calc(94px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}header{background:var(--card);padding:calc(20px + env(safe-area-inset-top)) 20px 20px;border-bottom:1px solid var(--line)}header small{font-size:12px;color:var(--muted);letter-spacing:2px;font-weight:700}h1{margin:6px 0 0;font-size:28px;letter-spacing:-.7px}main{max-width:760px;margin:auto;padding:18px 15px}.card{background:var(--card);border-radius:18px;padding:17px;margin-bottom:15px;border:1px solid #edf0f4}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row>*{min-width:0}h2{font-size:17px;margin:0 0 14px}h3{font-size:15px;margin:0}.hint{font-size:12px;color:var(--muted);line-height:1.55}.muted{color:var(--muted)}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat>div{background:#f6f8fc;border-radius:13px;padding:12px 8px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:#f0f3f8;color:var(--text);font-weight:650;min-height:44px}button.primary{background:var(--accent);color:#fff}button.soft{background:var(--sub);color:var(--accent)}button.danger{color:var(--danger);background:#fff1f1}button.small{padding:6px 10px;min-height:36px;font-size:12px}button:disabled{opacity:.45}input,select{width:100%;border:1px solid #dce2eb;background:white;border-radius:11px;padding:11px;font-size:16px;min-height:44px;color:var(--text)}input:focus,select:focus{outline:2px solid #a9c4ff;border-color:var(--accent)}label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:0 0 5px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.full{grid-column:1/-1}.exercise{border-top:1px solid var(--line);padding:15px 0}.exercise:first-child{border-top:0;padding-top:0}.sets{width:100%;border-collapse:separate;border-spacing:0 8px;table-layout:fixed}.sets th{font-size:11px;color:var(--muted);font-weight:600}.sets td{padding:0 3px;text-align:center}.sets input{text-align:center;padding:9px 2px;min-width:0}.sets th:first-child{width:31px}.sets th:last-child{width:42px}.settag{background:#f0f3f9;border-radius:8px;font-size:12px;padding:8px 3px;display:block}.pill{padding:6px 10px;border-radius:50px;background:#eef4ff;color:#1d4ed8;font-size:12px;font-weight:700}.item{padding:12px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}.item-title{font-weight:700;font-size:15px}.item-sub{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.6}nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:3;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(12px)}nav button{flex:1;max-width:170px;border-radius:0;background:transparent;color:var(--muted);height:65px;font-size:12px;font-weight:600}nav button.active{color:var(--accent)}nav .ico{display:block;font-size:23px;margin-bottom:3px}.empty{text-align:center;color:var(--muted);padding:30px 10px;line-height:1.7}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}.chart{display:flex;align-items:flex-end;height:150px;gap:8px;border-bottom:1px solid var(--line);padding:10px 0 0}.barwrap{display:flex;align-items:center;justify-content:flex-end;flex-direction:column;flex:1;height:100%;gap:5px}.bar{width:100%;max-width:48px;background:#8fb1f9;border-radius:6px 6px 0 0;min-height:3px}.barwrap span{font-size:10px;color:var(--muted);white-space:nowrap}.wide{width:100%}.split{display:flex;gap:8px;flex-wrap:wrap}.split>*{flex:1}#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:11px 15px;background:#172033;color:white;border-radius:12px;font-size:13px;z-index:9;max-width:90%;display:none;text-align:center} [hidden]{display:none!important}@media(min-width:580px){main{padding:25px}.card{padding:22px}} 
</style>
</head>
<body><div id="toast" role="status"></div><header><small>WORKOUT LOG</small><h1 id="pageTitle">今天练什么？</h1></header><main id="app"></main><nav aria-label="主导航"><button data-tab="today" class="active"><span class="ico">＋</span>记录训练</button><button data-tab="history"><span class="ico">▤</span>历史记录</button><button data-tab="progress"><span class="ico">▥</span>进步趋势</button><button data-tab="settings"><span class="ico">⚙</span>管理</button></nav>
<script>
(()=>{'use strict';const KEY='lianli-workout-v1';const seeds=[['胸部','杠铃卧推'],['胸部','哑铃卧推'],['胸部','上斜哑铃卧推'],['胸部','坐姿推胸'],['胸部','绳索夹胸'],['背部','高位下拉'],['背部','坐姿划船'],['背部','杠铃划船'],['背部','引体向上'],['肩部','哑铃推肩'],['肩部','哑铃侧平举'],['肩部','反向飞鸟'],['手臂','杠铃弯举'],['手臂','哑铃弯举'],['手臂','绳索下压'],['腿部','深蹲'],['腿部','腿举'],['腿部','腿屈伸'],['腿部','腿弯举'],['腿部','罗马尼亚硬拉'],['核心','卷腹'],['核心','平板支撑']];const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);const localDay=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const defaultState=()=>({exercises:seeds.map(([group,name])=>({id:uid(),name,group})),sessions:[]});let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null');if(!state||!Array.isArray(state.sessions)||!Array.isArray(state.exercises))throw Error()}catch{state=defaultState()}let tab='today',date=localDay(),query='',groupFilter='全部',progressExercise='',selectedSession='';const $=s=>document.querySelector(s),app=$('#app');const escape=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{toast('存储失败，请先导出备份');return false}};function toast(s){const el=$('#toast');el.textContent=s;el.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.style.display='none',2300)}function sess(day=date,create=false){let s=state.sessions.find(x=>x.date===day);if(!s&&create){s={id:uid(),date:day,items:[],note:''};state.sessions.push(s)}return s}function ex(id){return state.exercises.find(e=>e.id===id)}function fmt(n){return Number(n.toFixed(1)).toLocaleString('zh-CN')}function volume(s){return (s?.items||[]).reduce((sum,i)=>sum+i.sets.reduce((v,x)=>v+(Number(x.weight)||0)*(Number(x.reps)||0),0),0)}function countSets(s){return (s?.items||[]).reduce((v,i)=>v+i.sets.length,0)}function dayText(s){const [y,m,d]=s.split('-');return `${+m}月${+d}日`};function setTab(t){tab=t;selectedSession='';render()}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#pageTitle').textContent=({today:'今天练什么？',history:'训练日历',progress:'每一次都算数',settings:'动作与数据管理'})[tab];app.innerHTML=({today:renderToday,history:renderHistory,progress:renderProgress,settings:renderSettings})[tab]()}function renderToday(){const s=sess();const current=s?.items||[];const filtered=state.exercises.filter(e=>(groupFilter==='全部'||e.group===groupFilter)&&e.name.toLowerCase().includes(query.toLowerCase()));return `<div class="card"><div class="row"><div><label for="date">训练日期</label><input id="date" type="date" value="${escape(date)}" max="2099-12-31"></div><span class="pill">${s?'已保存':'新训练'}</span></div><div class="stat" style="margin-top:16px"><div><b>${current.length}</b><span>训练动作</span></div><div><b>${countSets(s)}</b><span>总组数</span></div><div><b>${fmt(volume(s))}</b><span>训练容量 kg</span></div></div></div><div class="card"><div class="section-title"><h2 style="margin:0">本次训练</h2><span class="hint">重量 kg · 次数</span></div>${current.length?current.map((it,idx)=>renderExercise(it,idx)).join(''):'<div class="empty">下方选择一个动作，开始记录训练。</div>'}<label for="note" style="margin-top:12px">训练备注</label><input id="note" placeholder="例如：今天卧推状态不错" value="${escape(s?.note||'')}"></div><div class="card"><h2>添加动作</h2><div class="formgrid"><div><label for="filter">动作分类</label><select id="filter">${['全部','胸部','背部','肩部','手臂','腿部','核心','其他'].map(g=>`<option ${g===groupFilter?'selected':''}>${g}</option>`).join('')}</select></div><div><label for="search">搜索动作</label><input id="search" value="${escape(query)}" placeholder="如：卧推"></div></div><div id="exList">${filtered.length?filtered.map(e=>`<div class="item row"><div><div class="item-title">${escape(e.name)}</div><div class="item-sub">${escape(e.group)}</div></div><button type="button" class="soft small" data-add="${escape(e.id)}">＋ 添加</button></div>`).join(''):'<div class="empty">没有找到动作，可到「管理」中新增。</div>'}</div></div>`}function renderExercise(it,idx){const e=ex(it.exerciseId);return `<div class="exercise"><div class="row"><div><h3>${escape(e?.name||it.name||'已删除动作')}</h3><div class="hint" style="margin-top:4px">${escape(e?.group||'自定义')}</div></div><button class="small danger" data-remove="${escape(it.id)}">移除</button></div><table class="sets"><thead><tr><th>组</th><th>重量(kg)</th><th>次数</th><th>删除</th></tr></thead><tbody>${it.sets.map((set,j)=>`<tr><td><span class="settag">${j+1}</span></td><td><input type="number" inputmode="decimal" min="0" max="9999" step="0.5" aria-label="第${j+1}组重量" data-weight="${it.id}" data-set="${j}" value="${escape(set.weight)}"></td><td><input type="number" inputmode="numeric" min="0" max="999" step="1" aria-label="第${j+1}组次数" data-reps="${it.id}" data-set="${j}" value="${escape(set.reps)}"></td><td><button class="danger small" aria-label="删除第${j+1}组" data-delset="${it.id}" data-set="${j}">×</button></td></tr>`).join('')}</tbody></table><button class="soft wide" data-addset="${it.id}">＋ 添加一组</button></div>`}function renderHistory(){const list=[...state.sessions].filter(s=>s.items.length).sort((a,b)=>b.date.localeCompare(a.date));if(selectedSession){const s=state.sessions.find(x=>x.id===selectedSession);if(!s){selectedSession='';return renderHistory()}return `<button class="soft" data-back="1">← 返回历史</button><div class="card" style="margin-top:14px"><div class="row"><h2>${escape(s.date)}</h2><button class="danger small" data-delete-session="${s.id}">删除该日</button></div><div class="stat"><div><b>${s.items.length}</b><span>动作</span></div><div><b>${countSets(s)}</b><span>组</span></div><div><b>${fmt(volume(s))}</b><span>kg 容量</span></div></div>${s.items.map(it=>`<div class="item"><div class="item-title">${escape(ex(it.exerciseId)?.name||it.name||'动作')}</div><div class="item-sub">${it.sets.map(x=>`${fmt(+x.weight||0)}kg × ${fmt(+x.reps||0)}次`).join(' / ')}</div></div>`).join('')}<p class="hint">${escape(s.note||'无备注')}</p><button class="primary wide" data-editdate="${s.date}">编辑当天训练</button></div>`}return `<div class="card"><h2>训练记录</h2>${list.length?list.map(s=>`<div class="item row"><div><div class="item-title">${escape(s.date)} <span class="pill">${s.items.length} 动作</span></div><div class="item-sub">${s.items.map(it=>ex(it.exerciseId)?.name||it.name||'动作').join('、')}</div><div class="item-sub">${countSets(s)} 组 · ${fmt(volume(s))} kg</div></div><button class="small soft" data-detail="${s.id}">查看</button></div>`).join(''):'<div class="empty">暂无历史训练。记录第一组后，这里会自动出现。</div>'}</div>`}function renderProgress(){const valid=state.exercises.filter(e=>state.sessions.some(s=>s.items.some(i=>i.exerciseId===e.id)));if(!progressExercise||!valid.some(e=>e.id===progressExercise))progressExercise=valid[0]?.id||'';const data=state.sessions.filter(s=>s.items.some(i=>i.exerciseId===progressExercise)).sort((a,b)=>a.date.localeCompare(b.date)).map(s=>{let sets=s.items.filter(i=>i.exerciseId===progressExercise).flatMap(i=>i.sets);return {date:s.date,max:Math.max(0,...sets.map(x=>+x.weight||0)),vol:sets.reduce((n,x)=>n+(+x.weight||0)*(+x.reps||0),0)}});const series=data.slice(-8),mx=Math.max(1,...series.map(d=>d.max));return `<div class="card"><h2>动作最大训练重量</h2>${valid.length?`<label for="progressEx">选择动作</label><select id="progressEx">${valid.map(e=>`<option value="${e.id}" ${e.id===progressExercise?'selected':''}>${escape(e.name)}</option>`).join('')}</select><div class="chart" aria-label="最近八次训练的最大重量">${series.map(d=>`<div class="barwrap"><span>${fmt(d.max)}kg</span><div class="bar" style="height:${Math.max(3,d.max/mx*100)}%"></div></div>`).join('')}</div><div class="row" style="margin-top:8px">${series.map(d=>`<div class="hint" style="flex:1;text-align:center;font-size:10px">${dayText(d.date)}</div>`).join('')}</div><p class="hint">每根柱子代表该动作当天记录的最高重量，并非估算 1RM。</p>`:'<div class="empty">开始记录训练后，将在这里看到各动作重量变化。</div>'}</div><div class="card"><h2>总体统计</h2><div class="stat"><div><b>${state.sessions.filter(s=>s.items.length).length}</b><span>训练天数</span></div><div><b>${state.sessions.reduce((n,s)=>n+countSets(s),0)}</b><span>累计组数</span></div><div><b>${fmt(state.sessions.reduce((n,s)=>n+volume(s),0))}</b><span>累计容量 kg</span></div></div></div>`}function renderSettings(){return `<div class="card"><h2>新增自定义动作</h2><form id="newEx"><div class="formgrid"><div><label for="newName">动作名称</label><input id="newName" required maxlength="40" placeholder="如：史密斯卧推"></div><div><label for="newGroup">动作分类</label><select id="newGroup">${['胸部','背部','肩部','手臂','腿部','核心','其他'].map(g=>`<option>${g}</option>`).join('')}</select></div><button class="primary full" type="submit">＋ 保存动作</button></div></form></div><div class="card"><h2>动作库（${state.exercises.length}）</h2>${state.exercises.map(e=>`<div class="item row"><div><div class="item-title">${escape(e.name)}</div><div class="item-sub">${escape(e.group)}</div></div><button class="small danger" data-delete-ex="${e.id}">删除</button></div>`).join('')}</div><div class="card"><h2>数据备份</h2><p class="hint">所有记录保存在当前设备的浏览器中。清理 Safari 网站数据、更换手机或使用不同浏览器可能丢失记录。建议定期导出备份。</p><div class="split"><button class="primary" id="export">导出 JSON 备份</button><button class="soft" id="import">导入备份</button></div><input id="importFile" type="file" accept="application/json,.json" hidden><p class="hint">导入会替换当前所有动作和训练记录。使用 iPhone「文件」App 保存或分享导出的文件。</p></div>`}function changeSet(node,isWeight){const s=sess();const it=s?.items.find(x=>x.id===node.dataset[isWeight?'weight':'reps']);const set=it?.sets[+node.dataset.set];if(!set)return;const val=node.value.trim();if(val===''){set[isWeight?'weight':'reps']='';save();return}const n=Number(val);if(!Number.isFinite(n)||n<0||n>(isWeight?9999:999)){toast('请输入有效的非负数');node.value=set[isWeight?'weight':'reps'];return}set[isWeight?'weight':'reps']=isWeight?Math.round(n*100)/100:Math.floor(n);save();const stats=$('.stat');if(stats){stats.children[2].querySelector('b').textContent=fmt(volume(s))}}app.addEventListener('change',ev=>{const t=ev.target;if(t.id==='date'){if(!/^\d{4}-\d{2}-\d{2}$/.test(t.value)){toast('日期无效');return}date=t.value;render()}else if(t.id==='filter'){groupFilter=t.value;render()}else if(t.id==='note'){sess(date,true).note=t.value;save()}else if(t.hasAttribute('data-weight'))changeSet(t,true);else if(t.hasAttribute('data-reps'))changeSet(t,false);else if(t.id==='progressEx'){progressExercise=t.value;render()}else if(t.id==='importFile'){const f=t.files?.[0];if(!f)return;if(f.size>5e6){toast('备份文件过大');return}const reader=new FileReader();reader.onload=()=>{try{const v=JSON.parse(reader.result);if(!Array.isArray(v.exercises)||!Array.isArray(v.sessions)||v.exercises.length>3000||v.sessions.length>20000||!v.exercises.every(e=>typeof e.id==='string'&&typeof e.name==='string'&&typeof e.group==='string')||!v.sessions.every(s=>typeof s.date==='string'&&Array.isArray(s.items)&&s.items.every(i=>Array.isArray(i.sets))))throw Error();if(confirm('确认导入？这将覆盖本机现有训练数据。')){state=v;save();render();toast('导入成功')}}catch{toast('备份文件格式不正确')}};reader.readAsText(f)}});app.addEventListener('input',ev=>{if(ev.target.id==='search'){query=ev.target.value;const target=$('#exList');const filtered=state.exercises.filter(e=>(groupFilter==='全部'||e.group===groupFilter)&&e.name.toLowerCase().includes(query.toLowerCase()));target.innerHTML=filtered.length?filtered.map(e=>`<div class="item row"><div><div class="item-title">${escape(e.name)}</div><div class="item-sub">${escape(e.group)}</div></div><button class="soft small" data-add="${e.id}">＋ 添加</button></div>`).join(''):'<div class="empty">没有找到动作，可在管理中新增。</div>'}else if(ev.target.id==='note'){sess(date,true).note=ev.target.value;save()}});app.addEventListener('submit',ev=>{if(ev.target.id!=='newEx')return;ev.preventDefault();const name=$('#newName').value.trim(),group=$('#newGroup').value;if(!name){toast('请输入动作名称');return}if(state.exercises.some(e=>e.name===name)){toast('动作已存在');return}state.exercises.push({id:uid(),name,group});save();render();toast('动作已添加')});app.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset;if(d.add){const s=sess(date,true);const e=ex(d.add);if(!e)return;const existing=s.items.find(i=>i.exerciseId===e.id);if(existing){toast('本次训练已添加这个动作');return}let prev=[...state.sessions].filter(x=>x.date<date).sort((a,b)=>b.date.localeCompare(a.date)).flatMap(x=>x.items).find(i=>i.exerciseId===e.id);s.items.push({id:uid(),exerciseId:e.id,name:e.name,sets:[{weight:prev?.sets.at(-1)?.weight??'',reps:prev?.sets.at(-1)?.reps??''}]});save();render();toast('已添加动作')}else if(d.remove){if(!confirm('移除此动作及其本次组数？'))return;const s=sess();s.items=s.items.filter(i=>i.id!==d.remove);save();render()}else if(d.addset){const s=sess(),it=s?.items.find(i=>i.id===d.addset);if(!it||it.sets.length>=50){toast('单个动作最多记录50组');return}const last=it.sets.at(-1);it.sets.push({weight:last?.weight??'',reps:last?.reps??''});save();render()}else if(d.delset){const s=sess(),it=s?.items.find(i=>i.id===d.delset);if(!it)return;it.sets.splice(+d.set,1);if(!it.sets.length)it.sets.push({weight:'',reps:''});save();render()}else if(d.detail){selectedSession=d.detail;render()}else if(d.back){selectedSession='';render()}else if(d.editdate){date=d.editdate;setTab('today')}else if(d.deleteSession){if(confirm('确定删除这一天的全部训练记录吗？')){state.sessions=state.sessions.filter(s=>s.id!==d.deleteSession);save();selectedSession='';render()}}else if(d.deleteEx){if(!confirm('删除此动作？历史训练记录将保留动作名称，但该动作无法再用于新训练。'))return;state.exercises=state.exercises.filter(e=>e.id!==d.deleteEx);save();render()}else if(b.id==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`练力备份-${localDay()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);toast('备份文件已生成')}else if(b.id==='import')$('#importFile').click()});document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
